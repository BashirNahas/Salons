name: salons_app
description: Premium salon appointment booking app for the Salons System platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local persistence (booking history, language preference)
  shared_preferences: ^2.3.4

  # Typography (Inter for Latin, Cairo for Arabic)
  google_fonts: ^6.2.1

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
